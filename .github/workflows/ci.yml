name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The JavaScript unit tests (Markdown renderer, event-stream parser) run through pytest.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # Unit, API, front-end and real-PDF tests. No API key and no model download are needed.
      - name: Run the tests
        run: python -m pytest tests -q
